<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Guiado 6 - Upload de imagem</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Upload de avatar</h1>
        <h5>Sua imagem pode ter no máximo 2 MB</h5>

        <button id="uploadBtn">Selecione uma imagem</button>
        <input type="file" id="fileInput" accept="image/*">

        <div class="actions">
            <button id="removeBtn" class="removeBtn">Remover</button>
        </div>

        <img id="preview" alt="Imagem salva!">
    </div>
</body>
<script src="js/scripts.js"></script>
</html>

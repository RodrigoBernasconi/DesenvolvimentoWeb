<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Guiado 5 - Lista de tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="task-list">
            <h2>Lista de tarefas</h2>
            <input type="text" id="item" placeholder="Digite aqui sua tarefa...">
            <br><br>
            <button onclick="add()">Adicionar</button>
            <button onclick="remove()">Limpar tudo</button>
        </div>
        <!-- A nossa lista de tarefas será uma lista não ordenada(li) -->
        <ul class="tasks"></ul>
    </div>
</body>
<script src="js/scripts.js"></script>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki da Vida Selvagem</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="assets/icons8-leão-100.png">
</head>
<body>
    <header class="site-header">
        <h1>Wiki da Vida Selvagem</h1>
        <p class="subtitle">Desenvolvido com a <a href="https://api-ninjas.com/">API Ninjas</a></p>
    </header>
    <!-- Conteúdo principal -->
    <main class="main-container">
        <section class="search-section">
            <!-- Form de busca -->
            <form id="search-form" role="search" aria-label="Pesquisar animal">
                <div class="input-row">
                    <label for="search-input" class="visually-hidden">Pesquisar animais</label>
                    <input 
                        id="search-input"
                        type="text"
                        placeholder="Pesquise um animal"
                        autocomplete="off"
                        required>
                    
                    <!-- Botão de busca -->
                    <button type="submit" id="search-btn">Pesquisar</button>
                </div>
            </form>
        </section>

        <!-- Mensagem de status / erro -->
        <div id="status-message" class="status-message" role="status" aria-live="polite" hidden></div>

        <!-- Spinner de carregamento -->
        <div id="loader" class="loader" hidden>
            <div class="spinner"></div>
            <p>Buscando animais</p>
        </div>

        <!-- Seção de resultados -->
        <section id="results-section" hidden>
            <div class="results-header">
                <h2 id="results-title">Resultados</h2>
                <span id="results-count" class="results-count"></span>
            </div>

            <!-- Div na qual os cards são inseridos -->
            <div id="results-grid" class="results-grid"></div>

            <div id="pagination" class="pagination" hidden>
                <button id="btn-prev" disabled><- Anterior</button>
                <span id="page-indicator">Página 1</span>
                <button id="btn-next">Próxima -></button>
            </div>
        </section>

        <!-- Modal de detalhes dos animais -->
        <div id="modal-overlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal">
                <button id="modal-close" class="modal-close" aria-labelledby="Fechar detalhes">X</button>
                <div id="modal-body" class="modal-body"></div>
            </div>
        </div>
    </main>

    <!-- Rodapé com informações dos integrantes-->
    <footer class="site-footer">
        <p>Desenvolvimento Web - UNISINOS</p>
        <p>Felipe Alles Garcia & Rodrigo Ritzel Bernasconi</p>
        <p>Este trabalho faz uso da API da <a href="https://api-ninjas.com/api/animals" target="_blank">Animals API</a></p>
    </footer>
</body>
<script src="js/scripts.js"></script>
</html>

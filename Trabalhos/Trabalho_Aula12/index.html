<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho da aula 12</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="img-container">
        <div class="img-x200 box"><img src="img/coffeeBottle.png" alt="Coffe Bottle"></div>
        <div class="img-x200 box"><img src="img/coffeeJava.png" alt="Coffee Java"></div>
        <div class="img-x200 box"><img src="img/coffeeJar.png" alt="Coffee Jar"></div>
        <div class="img-x200 box"><img src="img/coffeePack.png" alt="Coffee Pack"></div>
        <div class="img-x200 box"><img src="img/coffeKettle.png" alt="Coffee Kettle"></div>
        <div class="img-x200 box"><img src="img/giganticSandwich.png" alt="Giant Sandwich"></div>
        <div class="img-x200 box"><img src="img/lamen.png" alt="Lamen"></div>
        <div class="img-x200 box"><img src="img/taco.png" alt="Taco"></div>
        <div class="img-x200 box"><img src="img/burrito.png" alt="Burrito"></div>
        <div class="img-x200 box"><img src="img/greenApple.png" alt="Green Apple"></div>
    </div>
    <div class="buttons-container">
        <div class="btn-area">
            <button id="plus-btn" class="btn">+</button>
        </div>
        <div class="btn-area">
            <button id="minus-btn" class="btn">-</button>
        </div>
    </div>
</body>
<script src="js/scripts.js"></script>
</html>

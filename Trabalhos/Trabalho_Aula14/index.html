<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho aula 14 - Upload de imagem</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Upload de avatar</h1>
        <h5>Sua imagem pode ter no máximo 2 MB</h5>

        <button id="uploadBtn">Selecione uma imagem</button>
        <input type="file" id="fileInput" accept="image/*">

        <div class="actions">
            <button id="removeBtn" class="removeBtn">Remover</button>
        </div>

        <div class="actions">
            <button id="galeryBtn" class="galeryBtn">Galeria</button>
        </div>
        <a href="../Trabalho_Aula14/photos.html" id="photo-page" class="photos-link"></a>
    </div>
</body>
<script src="js/scripts.js"></script>
</html>
